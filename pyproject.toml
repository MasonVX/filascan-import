[project]
name = "filascan-import"
version = "0.1.13"
description = "FilaMan integration plugin for importing decoded FilaScan spool data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
authors = [{ name = "MasonVX" }]
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]

[project.urls]
Repository = "https://github.com/MasonVX/filascan-import"
Issues = "https://github.com/MasonVX/filascan-import/issues"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
